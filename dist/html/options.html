<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <title>Apex Chess</title>
    <link rel="stylesheet" type="text/css" href="../css/options.css">
    <link rel="stylesheet" type="text/css" href="../css/material-icon.css">
    <script src="../js/options.js"></script>
</head>

<body>
    <div class="header-container">
        <div class="header-top">
            <img src="../img/logo-h.png" alt="Apex Chess" class="main-logo" />
            <div class="lang-switch" role="group" aria-label="Language Selector">
                <button type="button" id="lang-btn-id" class="lang-btn active" title="Bahasa Indonesia">ID</button>
                <button type="button" id="lang-btn-en" class="lang-btn" title="English">EN</button>
            </div>
        </div>
        <div class="header-subbar">
            <span class="status-badge" data-i18n="statusSave">Pengaturan tersimpan otomatis</span>
            <span class="version-tag">v2.0 PRO</span>
        </div>
    </div>

    <div class="container">

        <!-- Sliders -->
        <div class="options-slider" data-min="1" data-max="25">
            <div class="title" data-i18n-title="titleDepth">KEDALAMAN ENGINE:</div>
            <input id="option-depth" type="range" value="12" />
        </div>

        <div class="options-slider" data-min="1" data-max="8">
            <div class="title" data-i18n-title="titleThreads">THREAD CPU:</div>
            <input id="option-threads" type="range" value="2" />
        </div>

        <!-- Section Title: Core Analysis -->
        <div class="section-divider">
            <span class="divider-line"></span>
            <span class="divider-text">ANALYSIS & HINTS</span>
            <span class="divider-line"></span>
        </div>

        <div class="options-checkbox">
            <input id="option-show-hints" type="checkbox" />
            <label for="option-show-hints">
                <span data-i18n="labelShowHints">Tampilkan Petunjuk Langkah</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">help_outline</span>
                    <span class="tooltiptext" data-i18n="tooltipShowHints">Tampilkan panah langkah khusus saat giliran Anda.</span>
                </div>
            </label>
        </div>

        <!-- Hint Mode Selector -->
        <div class="options-select-row">
            <div class="select-label-wrap">
                <span class="select-label" data-i18n="labelHintMode">Gaya Analisis Langkah:</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">help_outline</span>
                    <span class="tooltiptext" data-i18n="tooltipHintMode">Pilih gaya rekomendasi: melihat spektrum langkah (Brilliant/Great/Inaccuracy/Blunder) atau saran langkah aman anti-deteksi.</span>
                </div>
            </div>
            <select id="option-hint-mode" class="custom-select">
                <option value="classified" data-i18n="optHintClassified">Spektrum Lengkap (Brilliant → Blunder)</option>
                <option value="stealth" data-i18n="optHintStealth">Anti-Deteksi (Langkah Humanis & Aman)</option>
                <option value="best" data-i18n="optHintBest">Langkah Terbaik Saja (Klasik)</option>
            </select>
        </div>

        <div class="options-checkbox">
            <input id="option-move-analysis" type="checkbox" />
            <label for="option-move-analysis">
                <span data-i18n="labelMoveAnalysis">Analisis Kualitas Langkah</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">help_outline</span>
                    <span class="tooltiptext" data-i18n="tooltipMoveAnalysis">Tampilkan badge kualitas: Brilliant, Best Move, Inaccuracy, dll.</span>
                </div>
            </label>
        </div>

        <div class="options-checkbox">
            <input id="option-evaluation-bar" type="checkbox" />
            <label for="option-evaluation-bar">
                <span data-i18n="labelEvalBar">Bilah Evaluasi (Eval Bar)</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">help_outline</span>
                    <span class="tooltiptext" data-i18n="tooltipEvalBar">Tampilkan keuntungan posisi secara langsung di sisi papan.</span>
                </div>
            </label>
        </div>

        <div class="options-checkbox">
            <input id="option-depth-bar" type="checkbox" />
            <label for="option-depth-bar">
                <span data-i18n="labelDepthBar">Bilah Progres Kalkulasi</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">help_outline</span>
                    <span class="tooltiptext" data-i18n="tooltipDepthBar">Tampilkan status progress kalkulasi Stockfish.</span>
                </div>
            </label>
        </div>

        <div class="options-checkbox">
            <input id="option-opening-hud" type="checkbox" />
            <label for="option-opening-hud">
                <span data-i18n="labelOpeningHUD">HUD Nama Pembukaan (ECO Book)</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">menu_book</span>
                    <span class="tooltiptext" data-i18n="tooltipOpeningHUD">Tampilkan nama pembukaan catur resmi dan kode ECO (misal Sicilian, Ruy Lopez) di atas papan catur.</span>
                </div>
            </label>
        </div>

        <div class="options-checkbox">
            <input id="option-threat-radar" type="checkbox" />
            <label for="option-threat-radar">
                <span data-i18n="labelThreatRadar">Radar Ancaman Lawan (Threat Radar)</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">radar</span>
                    <span class="tooltiptext" data-i18n="tooltipThreatRadar">Tandai kotak atau perwira Anda yang sedang diancam oleh taktik serangan terbaik lawan.</span>
                </div>
            </label>
        </div>

        <!-- Section Title: Engine Engine & Stealth -->
        <div class="section-divider">
            <span class="divider-line"></span>
            <span class="divider-text">ADVANCED & STEALTH</span>
            <span class="divider-line"></span>
        </div>

        <div class="options-checkbox">
            <input id="option-use-nnue" type="checkbox" />
            <label for="option-use-nnue">
                <span data-i18n="labelUseNNUE">Gunakan Neural Network (NNUE)</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">help_outline</span>
                    <span class="tooltiptext" data-i18n="tooltipUseNNUE">Evaluasi lebih akurat namun membutuhkan file network ~45MB.</span>
                </div>
            </label>
        </div>

        <div class="options-checkbox">
            <input id="option-adaptive-timing" type="checkbox" />
            <label for="option-adaptive-timing">
                <span data-i18n="labelAdaptiveTiming">Waktu Adaptif (Bullet/Blitz Speed-Up)</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">speed</span>
                    <span class="tooltiptext" data-i18n="tooltipAdaptiveTiming">Otomatis mempercepat reaksi engine & jalan otomatis saat bermain Bullet (1m) & Blitz (3m/5m), dan normalkan saat Rapid/Bot.</span>
                </div>
            </label>
        </div>

        <div class="options-checkbox">
            <input id="option-boss-key" type="checkbox" />
            <label for="option-boss-key">
                <span data-i18n="labelBossKey">Tombol Rahasia / Boss Key ('H')</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">visibility_off</span>
                    <span class="tooltiptext" data-i18n="tooltipBossKey">Tekan tombol H di keyboard untuk menyembunyikan atau memunculkan seluruh bantuan visual seketika (1ms).</span>
                </div>
            </label>
        </div>

        <div class="options-checkbox">
            <input id="option-deep-calc" type="checkbox" />
            <label for="option-deep-calc">
                <span data-i18n="labelDeepCalc">Hitung Mendalam Cepat ('Spacebar')</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">bolt</span>
                    <span class="tooltiptext" data-i18n="tooltipDeepCalc">Tekan tombol Spasi di keyboard untuk memicu perhitungan Stockfish mendalam (depth 22) di posisi sulit.</span>
                </div>
            </label>
        </div>

        <div class="options-checkbox highlight-risk">
            <input id="option-auto-move" type="checkbox" />
            <label for="option-auto-move">
                <span data-i18n="labelAutoMove">Jalan Otomatis (Anti-Cheat Jitter)</span>
                <div class="tooltip">
                    <span class="material-icons info-icon">warning_amber</span>
                    <span class="tooltiptext">
                        <span data-i18n="tooltipAutoMove">Langkah otomatis dengan jeda alami manusia (800ms-2200ms) dan randomisasi langkah 2.</span>
                        <br/>
                        <span style="color:#ff5555; font-weight:600;" data-i18n="warningAutoMove">PERINGATAN: Gunakan hanya untuk latihan melawan bot catur.</span>
                    </span>
                </div>
            </label>
        </div>

    </div>

</body>

</html>
